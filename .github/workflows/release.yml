name: Charlie Release & Multi-Stage Packaging Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.3.1)'
        required: true
        default: '1.3.1'
      build_number:
        description: 'Build sequence number'
        required: true
        default: '110'

jobs:
  # =========================================================================
  # STAGE 1: Code Quality, Observability & Secret Scanning
  # =========================================================================
  security_and_tests:
    name: Secret Scan & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi starlette httpx sqlalchemy cryptography "pydantic[email]" pyjwt bcrypt email-validator python-multipart psutil alembic

      - name: Run Pre-Build Secret Scan
        run: |
          cd "Charlie-Ai assistant"
          python -c "
          import re, sys
          from pathlib import Path
          patterns = [
              r'AIzaSy[A-Za-z0-9_-]{33}',
              r'sk-[A-Za-z0-9]{32,}',
              r'rzp_live_[A-Za-z0-9]{14,}',
              r'-----BEGIN (RSA )?PRIVATE KEY-----'
          ]
          leaks = []
          for p in Path('.').rglob('*.py'):
              try:
                  txt = p.read_text(encoding='utf-8', errors='ignore')
                  for pat in patterns:
                      if re.search(pat, txt):
                          leaks.append(f'{p}: matches {pat}')
              except Exception:
                  pass
          if leaks:
              print('FATAL: Leaked secrets detected:')
              for l in leaks: print('  ', l)
              sys.exit(1)
          print('Pre-build secret scan passed successfully.')
          "

      - name: Run Core & Security Tests
        run: |
          cd "Charlie-Ai assistant"
          export PYTHONPATH=.
          python -m unittest tests/test_observability_middleware.py tests/test_risk_mitigations.py tests/test_auth_rbac.py

  # =========================================================================
  # STAGE 2: Windows PyInstaller & Inno Setup Build
  # =========================================================================
  build_windows_dist:
    name: Build Windows Setup Artifact
    needs: security_and_tests
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Install Build Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt
          pip install -r "Charlie-Ai assistant/requirements.txt"

      - name: Execute Production Build Script
        id: build_step
        shell: pwsh
        run: |
          cd "Charlie-Ai assistant"
          $ver = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          $bld = if ("${{ github.event.inputs.build_number }}") { "${{ github.event.inputs.build_number }}" } else { "110" }
          
          python build_production.py --version $ver --build-number $bld
          
          $setupExe = Get-Item "dist/CHARLIE-Setup-$ver.exe" -ErrorAction SilentlyContinue
          if (-not $setupExe) {
            $setupExe = Get-Item "dist/CHARLIE-Setup.exe"
          }
          
          $hash = (Get-FileHash -Path $setupExe.FullName -Algorithm SHA256).Hash.ToLower()
          echo "SETUP_PATH=$($setupExe.FullName)" >> $env:GITHUB_ENV
          echo "SETUP_SHA256=$hash" >> $env:GITHUB_ENV
          echo "SETUP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-Setup-Windows
          path: dist/CHARLIE-Setup*.exe
          if-no-files-found: error

  # =========================================================================
  # STAGE 3: Draft GitHub Release with SHA-256
  # =========================================================================
  draft_release:
    name: Create GitHub Release Draft
    needs: build_windows_dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Charlie-Setup-Windows
          path: ./dist

      - name: Generate Release Notes & Create Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: ./dist/*
          body: |
            ## CHARLIE AI Desktop Release

            ### Build & Checksums
            - **Platform**: Windows 10/11 x64
            - **Binary**: `CHARLIE-Setup-${{ github.ref_name }}.exe`

            ### Cryptographic Verification
            Verify the SHA-256 checksum in PowerShell before execution:
            ```powershell
            Get-FileHash -Algorithm SHA256 .\CHARLIE-Setup-*.exe
            ```
            ---
            *Signed production artifact generated by GitHub Actions CI/CD.*
