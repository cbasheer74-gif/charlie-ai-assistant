name: Charlie CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi starlette httpx sqlalchemy cryptography "pydantic[email]" pyjwt bcrypt email-validator python-multipart psutil

    - name: Run Core & Security Test Suites
      run: |
        cd "Charlie-Ai assistant"
        export PYTHONPATH=.
        python -m unittest tests/test_observability_middleware.py tests/test_risk_mitigations.py tests/test_auth_rbac.py
